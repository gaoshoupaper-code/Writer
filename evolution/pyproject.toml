[project]
name = "writer-evolution"
version = "0.1.0"
description = "Writer evolution 服务：trace 摄入、查询、宏观统计、规则标红"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "openai>=1.50.0",
  "deepagents>=0.5.0",
  "pyyaml>=6.0",
  # 问题知识库一期相似检索（需求 20260731）：sqlite-vec 向量重排 + pysqlite3
  # （pysqlite3 提供 enable_load_extension，部分 Python 构建的标准 sqlite3 禁用了扩展加载）。
  "sqlite-vec>=0.1.6",
  "pysqlite3-binary>=0.5.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
